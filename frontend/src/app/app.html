<header class="topbar">
  <a routerLink="/search" aria-label="Kisna Image Search"><img class="logo" src="kisna-logo.png" alt="Kisna" width="345" height="69" /></a>
  <span class="product">Image Search</span>
  <i class="dot" [class.on]="online() === true" [class.off]="online() === false" [attr.title]="online() ? 'API connected' : 'API unreachable'"></i>
</header>

<div class="shell">
  <aside class="side">
    <a class="brand" routerLink="/search">
      <img class="logo" src="kisna-logo.png" alt="Kisna" width="345" height="69" />
      <span class="product">Image Search<small>Find similar jewellery</small></span>
    </a>

    <nav aria-label="Main">
      @for (n of nav; track n.path) {
        <a [routerLink]="n.path" routerLinkActive="active">
          <span class="ico" aria-hidden="true">{{ n.icon }}</span>
          <span class="lbl">{{ n.label }}</span>
        </a>
      }
    </nav>

    <div class="foot">
      <div class="status" role="status">
        <i class="dot" [class.on]="online() === true" [class.off]="online() === false"></i>
        {{ online() === null ? 'Checking API…' : online() ? 'API connected' : 'API unreachable' }}
      </div>
      <button class="btn ghost small-btn" (click)="tokenOpen.set(!tokenOpen())" [attr.aria-expanded]="tokenOpen()">
        🔑 Admin token{{ auth.token() ? ' ✓' : '' }}
      </button>
      @if (tokenOpen()) {
        <div class="token">
          <input type="password" placeholder="X-Admin-Token" aria-label="Admin token"
                 [value]="auth.token()" (change)="auth.set($any($event.target).value)" />
          <p class="muted small">Needed for Dashboard and Sync admin. Kept for this browser tab only.</p>
        </div>
      }
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
